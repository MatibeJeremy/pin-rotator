name: CI & Deploy to Render (feat/launch)

on:
  push:
    branches:
      - feat/launch
  pull_request:
    branches:
      - feat/launch

concurrency:
  group: deploy-feat-launch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  verify-and-build:
    name: Lint, Typecheck & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript check
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Verify Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  deploy-render:
    name: Deploy to Render
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/launch'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          ref: ${{ github.sha }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: launch-preview
          github_token: ${{ secrets.GITHUB_TOKEN }}
